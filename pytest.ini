# File: pytest.ini
# Purpose: pytest configuration — markers, paths, coverage settings.
[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Coverage
addopts =
    --cov=app
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-report=xml:coverage.xml
    --ignore=tests/e2e
    -v

# Custom markers
markers =
    unit: unit tests (no DB, no HTTP)
    integration: integration tests (DB + TestClient)
    e2e: end-to-end Playwright tests (requires running server)
