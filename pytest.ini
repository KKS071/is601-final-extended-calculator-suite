# File: pytest.ini
# Purpose: pytest configuration — markers, paths, coverage settings, warning filters.
[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# pytest-asyncio: set loop scope explicitly to silence PytestDeprecationWarning
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# Coverage
addopts =
    --cov=app
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-report=xml:coverage.xml
    #--ignore=tests/e2e
    #-v

# Custom markers
markers =
    unit: unit tests (no DB, no HTTP)
    integration: integration tests (DB + TestClient)
    e2e: end-to-end Playwright tests (requires running server)

# Warning filters
# - Fix root-cause warnings where possible (pydantic, starlette — fixed in source)
# - Suppress third-party warnings we cannot control
filterwarnings =
    # Third-party: passlib uses the deprecated 'crypt' module (removed in Py 3.13)
    ignore:'crypt' is deprecated:DeprecationWarning:passlib
    # Third-party: python-jose calls datetime.utcnow() internally
    ignore:datetime.datetime.utcnow:DeprecationWarning:jose
    # Catch-all for any remaining DeprecationWarnings from installed packages
    ignore::DeprecationWarning:pkg_resources
