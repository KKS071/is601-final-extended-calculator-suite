# File: pytest.ini
# Purpose: pytest configuration — coverage, asyncio mode, warning filters.
#          E2E tests are included in the default run; the live_server fixture
#          in tests/e2e/conftest.py starts the server automatically.
[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# pytest-asyncio: set loop scope explicitly to silence PytestDeprecationWarning
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# Coverage — included in every run (unit + integration + E2E)
addopts =
    --cov=app
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-report=xml:coverage.xml

# Custom markers
markers =
    unit: unit tests (no DB, no HTTP)
    integration: integration tests (DB + TestClient)
    e2e: end-to-end Playwright tests (live server started automatically)

# Warning filters
filterwarnings =
    ignore:'crypt' is deprecated:DeprecationWarning:passlib
    ignore:datetime.datetime.utcnow:DeprecationWarning:jose
    ignore::DeprecationWarning:pkg_resources
