<!-- File: templates/register.html -->
{% extends "base.html" %}
{% block title %}CalcApp — Register{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-white border border-slate-200 rounded-2xl shadow-md p-8 mt-4">

  <div class="flex justify-center mb-5">
    <div class="w-14 h-14 bg-blue-50 rounded-2xl flex items-center justify-center">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#2563eb"
           stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="4" y="2" width="16" height="20" rx="2"/>
        <line x1="8" y1="6" x2="16" y2="6"/>
        <line x1="8" y1="10" x2="10" y2="10"/><line x1="14" y1="10" x2="16" y2="10"/>
        <line x1="8" y1="14" x2="10" y2="14"/><line x1="14" y1="14" x2="16" y2="14"/>
        <line x1="8" y1="18" x2="10" y2="18"/><line x1="14" y1="18" x2="16" y2="18"/>
      </svg>
    </div>
  </div>

  <h2 class="text-2xl font-bold text-center text-slate-900 mb-1">Create Account</h2>
  <p class="text-center text-slate-500 text-sm mb-6">Get started with CalcApp for free</p>

  <div id="error-msg"
       class="hidden mb-4 px-4 py-3 bg-red-50 border border-red-200 text-red-700 rounded-lg text-sm"></div>
  <div id="success-msg"
       class="hidden mb-4 px-4 py-3 bg-green-50 border border-green-200 text-green-700 rounded-lg text-sm"></div>

  <div class="grid grid-cols-2 gap-3 mb-4">
    <div>
      <label for="first_name" class="block text-sm font-medium text-slate-700 mb-1">First Name</label>
      <input id="first_name" type="text" placeholder="First name"
             class="w-full px-3 py-2.5 border border-slate-300 rounded-lg text-sm
                    focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition" />
    </div>
    <div>
      <label for="last_name" class="block text-sm font-medium text-slate-700 mb-1">Last Name</label>
      <input id="last_name" type="text" placeholder="Last name"
             class="w-full px-3 py-2.5 border border-slate-300 rounded-lg text-sm
                    focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition" />
    </div>
  </div>

  <div class="mb-4">
    <label for="email" class="block text-sm font-medium text-slate-700 mb-1">Email</label>
    <input id="email" type="email" placeholder="you@example.com" autocomplete="email"
           class="w-full px-3 py-2.5 border border-slate-300 rounded-lg text-sm
                  focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition" />
  </div>

  <div class="mb-4">
    <label for="username" class="block text-sm font-medium text-slate-700 mb-1">Username</label>
    <input id="username" type="text" placeholder="Choose a username" autocomplete="username"
           class="w-full px-3 py-2.5 border border-slate-300 rounded-lg text-sm
                  focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition" />
  </div>

  <!-- Password -->
  <div class="mb-4">
    <label for="password" class="block text-sm font-medium text-slate-700 mb-1">Password</label>
    <div class="relative">
      <input id="password" type="password"
             placeholder="Min 8 chars — upper, lower, digit, symbol"
             autocomplete="new-password"
             class="w-full px-3 py-2.5 pr-10 border border-slate-300 rounded-lg text-sm
                    focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition" />
      <button type="button" data-pwd-toggle="password" aria-label="Show password"
              class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400
                     hover:text-slate-600 transition-colors focus:outline-none">
        <svg class="eye-open" xmlns="http://www.w3.org/2000/svg" width="18" height="18"
             viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" style="pointer-events:none">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
        <svg class="eye-shut" xmlns="http://www.w3.org/2000/svg" width="18" height="18"
             viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round"
             style="display:none;pointer-events:none">
          <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
          <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
          <line x1="1" y1="1" x2="23" y2="23"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Confirm Password -->
  <div class="mb-6">
    <label for="confirm_password" class="block text-sm font-medium text-slate-700 mb-1">Confirm Password</label>
    <div class="relative">
      <input id="confirm_password" type="password" placeholder="Repeat password"
             autocomplete="new-password"
             class="w-full px-3 py-2.5 pr-10 border border-slate-300 rounded-lg text-sm
                    focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition" />
      <button type="button" data-pwd-toggle="confirm_password" aria-label="Show password"
              class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400
                     hover:text-slate-600 transition-colors focus:outline-none">
        <svg class="eye-open" xmlns="http://www.w3.org/2000/svg" width="18" height="18"
             viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" style="pointer-events:none">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
        <svg class="eye-shut" xmlns="http://www.w3.org/2000/svg" width="18" height="18"
             viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round"
             style="display:none;pointer-events:none">
          <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
          <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
          <line x1="1" y1="1" x2="23" y2="23"/>
        </svg>
      </button>
    </div>
  </div>

  <button id="register-btn"
          class="w-full py-2.5 bg-blue-600 hover:bg-blue-700 disabled:opacity-60
                 text-white font-semibold rounded-lg shadow transition-colors">
    Create Account
  </button>

  <p class="text-center text-sm text-slate-500 mt-5">
    Already have an account?
    <a href="/login" class="text-blue-600 font-medium hover:underline">Sign in</a>
  </p>
</div>
{% endblock %}

{% block scripts %}
<script>
document.addEventListener("DOMContentLoaded", function () {

  /* ── Password visibility toggles ────────────────────────────────── */
  document.querySelectorAll("[data-pwd-toggle]").forEach(function (btn) {
    btn.addEventListener("click", function () {
      var inp = document.getElementById(btn.getAttribute("data-pwd-toggle"));
      if (!inp) return;
      var reveal  = inp.type === "password";
      inp.type    = reveal ? "text" : "password";
      var eyeOpen = btn.querySelector(".eye-open");
      var eyeShut = btn.querySelector(".eye-shut");
      if (eyeOpen) eyeOpen.style.display = reveal ? "none" : "";
      if (eyeShut) eyeShut.style.display = reveal ? ""     : "none";
    });
  });

  /* ── Register ────────────────────────────────────────────────────── */
  function showError(msg) {
    var el = document.getElementById("error-msg");
    el.textContent = msg; el.classList.toggle("hidden", !msg);
  }
  function showSuccess(msg) {
    var el = document.getElementById("success-msg");
    el.textContent = msg; el.classList.toggle("hidden", !msg);
  }
  function setBusy(busy) {
    var btn = document.getElementById("register-btn");
    btn.disabled = busy;
    btn.textContent = busy ? "Creating account…" : "Create Account";
  }

  function doRegister() {
    showError(""); showSuccess("");
    var fn  = document.getElementById("first_name").value.trim();
    var ln  = document.getElementById("last_name").value.trim();
    var em  = document.getElementById("email").value.trim();
    var un  = document.getElementById("username").value.trim();
    var pw  = document.getElementById("password").value;
    var cpw = document.getElementById("confirm_password").value;

    if (!fn || !ln || !em || !un || !pw || !cpw) { showError("All fields are required."); return; }
    if (pw !== cpw)      { showError("Passwords do not match."); return; }
    if (pw.length < 8)   { showError("Password must be at least 8 characters."); return; }
    if (!/[A-Z]/.test(pw)) { showError("Password needs an uppercase letter."); return; }
    if (!/[a-z]/.test(pw)) { showError("Password needs a lowercase letter."); return; }
    if (!/[0-9]/.test(pw)) { showError("Password needs a digit."); return; }
    if (!/[!@#$%^&*()\-_=+\[\]{}|;:,.<>?]/.test(pw)) {
      showError("Password needs a special character (!@#$%^&* etc)."); return;
    }

    setBusy(true);
    fetch("/auth/register", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ first_name: fn, last_name: ln, email: em,
                             username: un, password: pw, confirm_password: cpw })
    })
    .then(function (res) {
      return res.json().then(function (data) {
        if (!res.ok) {
          var detail = Array.isArray(data.detail)
            ? data.detail.map(function (e) { return e.msg; }).join(" | ")
            : (data.detail || "Registration failed.");
          showError(detail); setBusy(false); return;
        }
        showSuccess("Account created! Redirecting to login…");
        setTimeout(function () { window.location.href = "/login"; }, 1500);
      });
    })
    .catch(function () { showError("Network error — is the server running?"); setBusy(false); });
  }

  document.getElementById("register-btn").addEventListener("click", doRegister);
  ["first_name","last_name","email","username","password","confirm_password"].forEach(function (id) {
    document.getElementById(id).addEventListener("keydown", function (e) {
      if (e.key === "Enter") { e.preventDefault(); doRegister(); }
    });
  });
});
</script>
{% endblock %}
