<!-- File: templates/base.html -->
<!-- Purpose: Base layout — Tailwind CDN, calculator SVG brand, sticky navbar. -->
<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}CalcApp{% endblock %}</title>

  <!-- Tailwind CSS (Play CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: { DEFAULT: '#2563eb', dark: '#1d4ed8', light: '#eff6ff' }
          },
          fontFamily: {
            sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif']
          }
        }
      }
    }
  </script>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Minimal custom overrides -->
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body class="h-full bg-slate-50 text-slate-900 antialiased font-sans">

  <!-- Navbar -->
  <nav class="bg-gradient-to-r from-blue-700 to-blue-600 shadow-lg sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-4 h-14 flex items-center justify-between">

      <!-- Brand -->
      <a href="/" class="flex items-center gap-2.5 text-white font-bold text-lg tracking-tight no-underline">
        <div class="w-8 h-8 bg-white/20 rounded-lg flex items-center justify-center">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white"
               stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="4" y="2" width="16" height="20" rx="2"/>
            <line x1="8" y1="6"  x2="16" y2="6"/>
            <line x1="8" y1="10" x2="10" y2="10"/><line x1="14" y1="10" x2="16" y2="10"/>
            <line x1="8" y1="14" x2="10" y2="14"/><line x1="14" y1="14" x2="16" y2="14"/>
            <line x1="8" y1="18" x2="10" y2="18"/><line x1="14" y1="18" x2="16" y2="18"/>
          </svg>
        </div>
        CalcApp
      </a>

      <!-- Nav links -->
      <div class="flex items-center gap-1 text-sm font-medium">
        <a href="/" class="px-3 py-1.5 text-blue-100 hover:text-white hover:bg-white/10 rounded-md transition-colors">Home</a>
        <a href="/dashboard" id="nav-dashboard" class="px-3 py-1.5 text-blue-100 hover:text-white hover:bg-white/10 rounded-md transition-colors hidden">Dashboard</a>
        <a href="/profile"   id="nav-profile"   class="px-3 py-1.5 text-blue-100 hover:text-white hover:bg-white/10 rounded-md transition-colors hidden">Profile</a>
        <a href="/login"     id="nav-login"      class="px-3 py-1.5 text-blue-100 hover:text-white hover:bg-white/10 rounded-md transition-colors">Login</a>
        <a href="/register"  id="nav-register"   class="px-4 py-1.5 bg-white text-blue-700 hover:bg-blue-50 font-semibold rounded-md transition-colors">Register</a>
        <button id="nav-logout" onclick="logout()"
                class="px-3 py-1.5 text-blue-100 hover:text-white hover:bg-white/10 rounded-md transition-colors hidden cursor-pointer border-none bg-transparent">
          Logout
        </button>
      </div>
    </div>
  </nav>

  <!-- Page content -->
  <main class="max-w-6xl mx-auto px-4 py-8">
    {% block content %}{% endblock %}
  </main>

  <!-- Footer -->
  <footer class="border-t border-slate-200 mt-16 py-6 text-center text-sm text-slate-400">
    CalcApp &mdash; IS601 Final Project &bull;
    <a href="https://github.com/KKS071/is601-final-extended-calculator-suite"
       target="_blank" class="hover:text-blue-600 transition-colors">GitHub</a>
  </footer>

  <script src="/static/js/auth.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
