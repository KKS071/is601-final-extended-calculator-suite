<!-- File: templates/view_calculation.html -->
<!-- Purpose: View a single calculation by ID. -->
{% extends "base.html" %}
{% block title %}CalcApp — View Calculation{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto">
  <div class="flex items-center gap-3 mb-6">
    <a href="/dashboard"
       class="flex items-center gap-1 text-sm text-slate-500 hover:text-slate-700 transition-colors">
      ← Back to Dashboard
    </a>
  </div>

  <div class="bg-white border border-slate-200 rounded-2xl shadow-sm p-6">
    <h2 class="text-xl font-bold text-slate-900 mb-4 flex items-center gap-2">
      <span class="w-7 h-7 bg-sky-50 rounded-lg flex items-center justify-center text-sky-600 text-sm">👁</span>
      Calculation Details
    </h2>

    <div id="view-error"
         class="hidden mb-4 px-4 py-3 bg-red-50 border border-red-200 text-red-700 rounded-lg text-sm"></div>
    <div id="view-loading"
         class="text-slate-400 italic text-sm text-center py-8">Loading…</div>

    <div id="view-content" class="hidden">
      <div class="grid grid-cols-2 gap-4 mb-4">
        <div class="bg-slate-50 rounded-xl p-4">
          <div class="text-xs font-semibold text-slate-400 uppercase tracking-wide mb-1">Type</div>
          <div id="view-type" class="font-semibold text-slate-800"></div>
        </div>
        <div class="bg-blue-50 rounded-xl p-4">
          <div class="text-xs font-semibold text-blue-400 uppercase tracking-wide mb-1">Result</div>
          <div id="view-result" class="font-bold text-2xl text-blue-700"></div>
        </div>
      </div>
      <div class="bg-slate-50 rounded-xl p-4 mb-4">
        <div class="text-xs font-semibold text-slate-400 uppercase tracking-wide mb-2">Inputs</div>
        <div id="view-inputs" class="flex flex-wrap gap-1"></div>
      </div>
      <div class="grid grid-cols-2 gap-4 text-xs text-slate-400">
        <div>Created: <span id="view-created" class="text-slate-600 font-medium"></span></div>
        <div>Updated: <span id="view-updated" class="text-slate-600 font-medium"></span></div>
      </div>
      <div class="mt-5 flex gap-3">
        <a id="edit-link" href="#"
           class="px-4 py-2 bg-amber-500 hover:bg-amber-600 text-white text-sm font-semibold rounded-lg transition-colors">
          Edit
        </a>
        <a href="/dashboard"
           class="px-4 py-2 border border-slate-300 text-slate-600 hover:bg-slate-50 text-sm font-semibold rounded-lg transition-colors">
          Back
        </a>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.addEventListener("DOMContentLoaded", function () {
  var token  = localStorage.getItem("access_token");
  if (!token) { window.location.href = "/login"; return; }

  var calcId = window.location.pathname.split("/").pop();
  document.getElementById("edit-link").href = "/dashboard/edit/" + calcId;

  fetch("/calculations/" + calcId, {
    headers: { Authorization: "Bearer " + token }
  })
  .then(function (res) {
    document.getElementById("view-loading").classList.add("hidden");
    return res.json().then(function (d) {
      if (!res.ok) {
        var el = document.getElementById("view-error");
        el.textContent = d.detail || "Calculation not found.";
        el.classList.remove("hidden"); return;
      }
      document.getElementById("view-type").innerHTML =
        '<span class="badge badge-' + d.type + '">' + d.type + "</span>";
      document.getElementById("view-result").textContent = d.result;
      document.getElementById("view-inputs").innerHTML = d.inputs.map(function (n) {
        return '<span class="input-pill">' + n + "</span>";
      }).join("");
      document.getElementById("view-created").textContent = new Date(d.created_at).toLocaleString();
      document.getElementById("view-updated").textContent = new Date(d.updated_at).toLocaleString();
      document.getElementById("view-content").classList.remove("hidden");
    });
  })
  .catch(function () {
    document.getElementById("view-loading").classList.add("hidden");
    var el = document.getElementById("view-error");
    el.textContent = "Network error loading calculation.";
    el.classList.remove("hidden");
  });
});
</script>
{% endblock %}
