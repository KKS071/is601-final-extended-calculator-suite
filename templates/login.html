<!-- File: templates/login.html -->
<!-- Purpose: Login page — password visibility toggle, Enter key, stores full name. -->
{% extends "base.html" %}
{% block title %}CalcApp — Login{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-white border border-slate-200 rounded-2xl shadow-md p-8 mt-4">

  <div class="flex justify-center mb-5">
    <div class="w-14 h-14 bg-blue-50 rounded-2xl flex items-center justify-center">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#2563eb"
           stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="4" y="2" width="16" height="20" rx="2"/>
        <line x1="8" y1="6"  x2="16" y2="6"/>
        <line x1="8" y1="10" x2="10" y2="10"/><line x1="14" y1="10" x2="16" y2="10"/>
        <line x1="8" y1="14" x2="10" y2="14"/><line x1="14" y1="14" x2="16" y2="14"/>
        <line x1="8" y1="18" x2="10" y2="18"/><line x1="14" y1="18" x2="16" y2="18"/>
      </svg>
    </div>
  </div>

  <h2 class="text-2xl font-bold text-center text-slate-900 mb-1">Welcome back</h2>
  <p class="text-center text-slate-500 text-sm mb-6">Sign in to your CalcApp account</p>

  <div id="error-msg"
       class="hidden mb-4 px-4 py-3 bg-red-50 border border-red-200 text-red-700 rounded-lg text-sm"></div>

  <div class="mb-4">
    <label for="username" class="block text-sm font-medium text-slate-700 mb-1">Username or Email</label>
    <input id="username" type="text" placeholder="Enter username or email"
           autocomplete="username"
           class="w-full px-3 py-2.5 border border-slate-300 rounded-lg text-sm
                  focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition" />
  </div>

  <div class="mb-6">
    <label for="password" class="block text-sm font-medium text-slate-700 mb-1">Password</label>
    <!-- Password field with visibility toggle -->
    <div class="relative">
      <input id="password" type="password" placeholder="Enter password"
             autocomplete="current-password"
             class="w-full px-3 py-2.5 pr-10 border border-slate-300 rounded-lg text-sm
                    focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition" />
      <button type="button"
              onclick="togglePwd('password', this)"
              aria-label="Show password"
              class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400
                     hover:text-slate-600 transition-colors focus:outline-none">
        <!-- eye icon (password is hidden by default) -->
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
      </button>
    </div>
  </div>

  <button id="login-btn"
          class="w-full py-2.5 bg-blue-600 hover:bg-blue-700 disabled:opacity-60
                 text-white font-semibold rounded-lg shadow transition-colors">
    Sign In
  </button>

  <p class="text-center text-sm text-slate-500 mt-5">
    No account? <a href="/register" class="text-blue-600 font-medium hover:underline">Create one free</a>
  </p>
</div>
{% endblock %}

{% block scripts %}
<script>
document.addEventListener("DOMContentLoaded", function () {

  function showError(msg) {
    var el = document.getElementById("error-msg");
    el.textContent = msg;
    el.classList.toggle("hidden", !msg);
  }
  function setBusy(busy) {
    var btn = document.getElementById("login-btn");
    btn.disabled    = busy;
    btn.textContent = busy ? "Signing in…" : "Sign In";
  }

  function doLogin() {
    showError("");
    var username = document.getElementById("username").value.trim();
    var password = document.getElementById("password").value;
    if (!username || !password) { showError("Please fill in all fields."); return; }
    setBusy(true);
    fetch("/auth/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username: username, password: password })
    })
    .then(function (res) {
      return res.json().then(function (data) {
        if (!res.ok) {
          showError(data.detail || "Login failed. Check your credentials.");
          setBusy(false); return;
        }
        // Store token + identity fields
        localStorage.setItem("access_token",  data.access_token);
        localStorage.setItem("refresh_token", data.refresh_token || "");
        localStorage.setItem("user_id",       data.user_id       || "");
        localStorage.setItem("username",      data.username      || username);
        // Store full name for the dashboard welcome banner
        var fullName = ((data.first_name || "") + " " + (data.last_name || "")).trim();
        localStorage.setItem("full_name", fullName || data.username || username);
        window.location.href = "/dashboard";
      });
    })
    .catch(function () { showError("Network error — is the server running?"); setBusy(false); });
  }

  document.getElementById("login-btn").addEventListener("click", doLogin);
  ["username", "password"].forEach(function (id) {
    document.getElementById(id).addEventListener("keydown", function (e) {
      if (e.key === "Enter") { e.preventDefault(); doLogin(); }
    });
  });
});
</script>
{% endblock %}
