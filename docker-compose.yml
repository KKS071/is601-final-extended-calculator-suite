# File: docker-compose.yml
# Purpose: Local development stack — app + postgres + test-db.
version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: calcapp_db
    restart: unless-stopped
    environment:
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB:       fastapi_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  test_db:
    image: postgres:16-alpine
    container_name: calcapp_test_db
    restart: unless-stopped
    environment:
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB:       fastapi_test_db
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: calcapp_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL:              postgresql://postgres:postgres@db:5432/fastapi_db
      TEST_DATABASE_URL:         postgresql://postgres:postgres@test_db:5432/fastapi_test_db
      JWT_SECRET_KEY:            change-me-in-production
      JWT_REFRESH_SECRET_KEY:    change-me-refresh-in-production
      ALGORITHM:                 HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      REFRESH_TOKEN_EXPIRE_DAYS:   "7"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
