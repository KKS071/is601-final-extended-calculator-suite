# File: .github/workflows/ci.yml
# Purpose: CI/CD — test → Trivy scan → Docker build → Docker Hub push.

name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  IMAGE_NAME: kks59/is601-final-extended-calculator-suite

jobs:
  # ── 1. Test ──────────────────────────────────────────────────────────────────
  test:
    name: Run Tests & Coverage
    runs-on: ubuntu-latest
    environment: production

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER:     postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB:       fastapi_db
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      test_postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER:     postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB:       fastapi_test_db
        ports: ["5433:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest with coverage
        env:
          DATABASE_URL:              postgresql://postgres:postgres@localhost:5432/fastapi_db
          TEST_DATABASE_URL:         postgresql://postgres:postgres@localhost:5433/fastapi_test_db
          JWT_SECRET_KEY:            ${{ secrets.JWT_SECRET_KEY }}
          JWT_REFRESH_SECRET_KEY:    ${{ secrets.JWT_REFRESH_SECRET_KEY }}
          ALGORITHM:                 HS256
          ACCESS_TOKEN_EXPIRE_MINUTES: "30"
          REFRESH_TOKEN_EXPIRE_DAYS:   "7"
          BCRYPT_ROUNDS:             "4"
        run: |
          pytest \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --ignore=tests/e2e \
            -v

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  # ── 2. Trivy Security Scan ────────────────────────────────────────────────────
  trivy:
    name: Trivy Vulnerability Scan
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type:    fs
          scan-ref:     .
          severity:     CRITICAL,HIGH
          exit-code:    "0"
          format:       table
          ignore-unfixed: true

  # ── 3. Build & Push Docker Image ──────────────────────────────────────────────
  docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: [test, trivy]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags/labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context:   .
          push:      true
          tags:      ${{ steps.meta.outputs.tags }}
          labels:    ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      - name: Run Trivy image scan after push
        uses: aquasecurity/trivy-action@master
        with:
          image-ref:  ${{ env.IMAGE_NAME }}:latest
          severity:   CRITICAL,HIGH
          exit-code:  "0"
          format:     table
          ignore-unfixed: true
